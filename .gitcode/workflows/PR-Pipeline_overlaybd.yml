name: PR-Pipeline_overlaybd

on: # 自动触发工作流运行的触发条件
  pull_request:          # MR 事件触发
    types: ["open", "reopen", "update"]
    branches: ["*"]
  pull_request_comment:         # 评论触发（/compile、/ci、/recheck）
    types: [created]
    branches: ["*"]
    comments: ['^(?:\/)?(compile|ci|recheck)']

concurrency: # 并发控制（GitCode 原生语法）
  enable: true
  max: 3
  exceed-action: QUEUE
  preemption:
    enable: true
    events: [mr_id]

permissions:
  project: read
  repository: read
  id-token: write
  pr: write
  note: write

env:
  pr_id: ${{ atomgit.event.pull_request.number }}
  branch: ${{ atomgit.event.pull_request.base.ref }}
  default_branch: ${{ atomgit.event.repository.default_branch }}
  ci_image: "swr.cn-north-4.myhuaweicloud.com/cloud_boostkit/ubuntu_22.04:overlaybd_arm_01"

stages:
  # stage0: # 流水线状态管理（非项目逻辑）
  #   name: 初始化阶段
  #   select: selected_by_default
  #   jobs:
  #     associate_pr_comment:
  #       name: associate_pr_comment
  #       runs-on: [ self-hosted, os=euler, arch=arm64, type=pr, flavor=small ]
  #       steps:
  #         - name: associate_pr_comment
  #           uses: associate-pr-comment
  #     init_pipeline_status: # 打运行中标签
  #       name: init_pipeline_status
  #       runs-on: [ self-hosted, os=euler, arch=arm64, type=pr, flavor=small ]
  #       steps:
  #         - name: add running label
  #           uses: openlibing/pr-label-action@v1.0.0
  #           with:
  #             add_labels: ci-pipeline-running
  #             remove_labels: ci-pipeline-passed,ci-pipeline-failed
  #             token: ${{ secrets.PR_LABEL_TOKEN }}

  stage1: # 校验阶段
    name: 校验阶段
    select: selected_by_default
    jobs:
      Detect_file_changes: # 纯文档 MR 跳过 build/ut（必备作业）
        name: Detect_file_changes
        runs-on: ["ubuntu-latest", "x64", "slim"]
        outputs:
          need_build: ${{ steps.set-skip.outputs.need_build }}
        steps:
          - name: checkout
            uses: checkout
            with:
              allow-unsafe-pr-checkout: true
              ref: refs/merge-requests/${{ env.pr_id }}/merge
              fetch-depth: 0
          - name: Only_doc_commit
            id: filter
            uses: paths-changes-filter
            with:
              event-name: 'pull_request'
              base: ${{ env.branch }}
              repo: ${{ atomgit.repository }}
              number: ${{ env.pr_id }}
              token: ${{ secrets.GIT_TOKEN }}
              list-files: json
              predicate-quantifier: every
              filters: |
                changed:
                  - '**'
                doc-only:
                  - '**/*.md'
                  - '**/*.rst'
                  - '**/*.log'
                  - '**/*.png'
                  - '**/*.jpg'
                  - '**/*.jpeg'
                  - '**/*.svg'
                  - '**/*.gif'
                  - '**/*.pdf'
                  - 'docs/**'
                  - 'LICENSE'
                  - 'NOTICE'
          - name: set build skip flag
            id: set-skip
            run: |
              echo "changed: ${{ steps.filter.outputs.changed_files }}"
              echo "doc-only: ${{ steps.filter.outputs.doc-only }}"
              if [ "${{ steps.filter.outputs.doc-only }}" = "true" ]; then
                echo "need_build=no" >> "$ATOMGIT_OUTPUT"
              else
                echo "need_build=yes" >> "$ATOMGIT_OUTPUT"
              fi

      # sca-pr: 
      #   name: sca-pr
      #   runs-on: ["ubuntu-latest", "x64", "slim"]
      #   steps:
      #     - name: sca pr scan
      #       uses: openlibing/sca-action/sca-pr-action@v1.0.0
      #       with:
      #         project-name: "boostkit"

      # malicious-scan: 
      #   name: malicious-scan
      #   runs-on: ["ubuntu-latest", "x64", "slim"]
      #   steps:
      #     - name: malicious code scan
      #       uses: openlibing/malicious-code-scan-action/malicious-code-pr-scan-action@v1.0.0
      #       with:
      #         project-name: "boostkit"

      pre-commit: # 代码风格检查（仓库 .pre-commit-config.yaml）
        name: pre-commit
        runs-on: ["ubuntu-latest", "x64", "slim"]
        steps:
          - name: Checkout
            uses: checkout
            with:
              allow-unsafe-pr-checkout: true
              ref: refs/merge-requests/${{ env.pr_id }}/merge
          - name: Setup Python
            uses: setup-python
            with:
              python-version: "3.14"
          # 钩子仓库与虚拟环境按配置文件的 hash 缓存，避免每次重新 clone/安装
          - name: Cache pre-commit env
            uses: cache
            with:
              path: |
                ~/.cache/pre-commit
                ~/.cache/pip
              key: precommit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
              restore-keys: |
                precommit-${{ runner.os }}-
          - name: Run pre-commit
            uses: openlibing/pre-commit-action@v1.0.0
            env:
              # mirrors-clang-format 安装 clang-format wheel 时走国内源
              PIP_INDEX_URL: https://repo.huaweicloud.com/repository/pypi/simple

      build:
        name: build
        if: ${{ jobs.Detect_file_changes.outputs.need_build == 'yes' }}
        needs: [ Detect_file_changes ]      # 门控 outputs 引用必须保留
        uses: .gitcode/workflows/build_job.yml
        with:
          docker_img: "${{ env.ci_image }}"
          pr_id: "${{ env.pr_id }}"
          branch: "${{ env.branch }}"
          default_branch: "${{ env.default_branch }}"

      ut:
        name: ut
        if: ${{ jobs.Detect_file_changes.outputs.need_build == 'yes' }}
        needs: [ Detect_file_changes ]      # 门控 outputs 引用必须保留
        uses: .gitcode/workflows/ut_job.yml
        with:
          docker_img: "${{ env.ci_image }}"
          pr_id: "${{ env.pr_id }}"
          branch: "${{ env.branch }}"
          default_branch: "${{ env.default_branch }}"

